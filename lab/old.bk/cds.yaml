# =============================================================================
# RESUMEN DE CAMBIOS EN ESTE ARCHIVO:
# =============================================================================
# Aplicados a TODOS los 6 clusters:
#
# 1. connect_timeout: 5s → 15s
#    - Acomodar latencia VPN + Transit Gateway
#    - IMPACTO DIRECTO en reducción de TCP resets por timeout
#
# 2. NUEVO: dns_refresh_rate = 30s
#    - Resolución DNS periódica para detectar cambios de IP
#
# 3. NUEVO: lb_policy = ROUND_ROBIN (explícito)
#    - Claridad de configuración
#
# 4. NUEVO: sni en UpstreamTlsContext
#    - Correcta negociación TLS con el DataPower
#
# 5. NUEVO: circuit_breakers
#    - IMPACTO DIRECTO: Previene saturación del backend DataPower
#    - Clusters específicos: 256 conn / 256 pending / 512 requests / 3 retries
#    - Clusters catch-all: 512 conn / 512 pending / 1024 requests / 3 retries
#
# 6. NUEVO: upstream_connection_options con TCP keepalive
#    - IMPACTO DIRECTO: Previene conexiones "muertas" a través de VPN
#    - Probes cada 60s, 3 probes de 10s = detección en 90s max
#
# 7. NUEVO: outlier_detection
#    - Eyección automática de hosts con fallos consecutivos
#    - Previene envío de tráfico a upstreams degradados
#
# IMPACTO TOTAL ESPERADO:
#   Los cambios 1, 5 y 6 son los más críticos para resolver los TCP resets.
#   El cambio 1 evita timeouts de conexión prematuros.
#   El cambio 5 evita sobrecarga del DataPower.
#   El cambio 6 evita uso de conexiones cerradas por NAT/firewall en la VPN.
# =============================================================================
