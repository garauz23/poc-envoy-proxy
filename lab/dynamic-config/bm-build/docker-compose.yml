services:
  https-8450:
    build:
      context: ./https-service
    container_name: bm-https-8450
    environment:
      - PORT=8450
      - SERVICE_NAME=backend-8450
    ports:
      - "8450:8450"

  https-8443:
    build:
      context: ./https-service
    container_name: bm-https-8443
    environment:
      - PORT=8443
      - SERVICE_NAME=backend-8443
    ports:
      - "8443:8443"

  client-backend:
    build:
      context: ./client-backend
    container_name: bm-client-backend
    env_file:
      - .env
    environment:
      - PORT=5050
      - ENVOY_HOST=${ENVOY_HOST}
      - ENVOY_REST_PORT=${LISTENER_REST_PORT}
      - ENVOY_SOAP_PORT=${LISTENER_SOAP_PORT}
      - ALLOW_INSECURE_TLS=${ALLOW_INSECURE_TLS}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5050:5050"
