version_info: "0"
resources:
  - "@type": type.googleapis.com/envoy.config.route.v3.RouteConfiguration
    name: route_config_soap
    virtual_hosts:
      - name: vh
        domains: ["*"]
        routes:
          - match:
              prefix: "/"
              headers:
                - name: SOAPAction
                  string_match:
                    safe_regex:
                      regex: ".*AutenticarUsuarioV2.*"
            route:
              cluster: authentication_soap
          - match:
              prefix: "/"
              headers:
                - name: SOAPAction
                  string_match:
                    safe_regex:
                      regex: ".*ConsultarConsolidadoCuentasAfiliadas.*"
            route:
              cluster: authentication_soap
          - match:
              prefix: "/"
              headers:
                - name: SOAPAction
                  string_match:
                    safe_regex:
                      regex: ".*EjecutarTransaccionCanales.*"
            route:
              cluster: transactional_soap
          - match:
              prefix: "/"
              headers:
                - name: SOAPAction
                  string_match:
                    safe_regex:
                      regex: ".*ConsultarModeloSeguridadPorTransaccion.*"
            route:
              cluster: transactional_soap
          - match:
              prefix: "/"
            route:
              cluster: allendpoints_soap
