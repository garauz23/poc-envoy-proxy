version_info: "0"
resources:
  - "@type": type.googleapis.com/envoy.config.route.v3.RouteConfiguration
    name: route_config_rest
    virtual_hosts:
      - name: vh
        domains: ["*"]
        routes:
          - match:
              safe_regex:
                regex: ".*/AutenticarUsuarioV2$"
            route:
              cluster: authentication_rest
          - match:
              safe_regex:
                regex: ".*/ConsultarConsolidadoCuentasAfiliadas$"
            route:
              cluster: authentication_rest
          - match:
              safe_regex:
                regex: ".*/EjecutarTransaccionCanales$"
            route:
              cluster: transactional_rest
          - match:
              safe_regex:
                regex: ".*/ConsultarModeloSeguridadPorTransaccion$"
            route:
              cluster: transactional_rest
          - match:
              prefix: "/"
            route:
              cluster: allendpoints_rest
