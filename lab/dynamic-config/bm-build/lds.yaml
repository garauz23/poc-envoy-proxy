version_info: "0"
resources:
  - "@type": type.googleapis.com/envoy.config.listener.v3.Listener
    name: listener_rest
    enable_reuse_port: false
    address:
      socket_address:
        address: ${LISTENER_REST_ADDRESS}
        port_value: ${LISTENER_REST_PORT}
    filter_chains:
      - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: listener_http
              access_log:
                - name: envoy.access_loggers.stdout
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                    log_format:
                      text_format_source:
                        inline_string: "[%START_TIME%] %REQ(:METHOD)% %REQ(:PATH)% host=%REQ(:AUTHORITY)% ua=%REQ(USER-AGENT)% xff=%REQ(X-FORWARDED-FOR)% corr=%REQ(X-CORRELATION-ID)% cluster=%UPSTREAM_CLUSTER% upstream=%UPSTREAM_HOST% -> %RESPONSE_CODE% time=%DURATION%ms req_id=%REQ(X-REQUEST-ID)%\n"
              http_filters:
                - name: envoy.filters.http.router
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              rds:
                route_config_name: route_config_rest
                config_source:
                  path_config_source:
                    path: ./rds/rest.yaml
        transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
            common_tls_context:
              tls_certificates:
                - certificate_chain:
                    filename: ./certs/envoy.crt
                  private_key:
                    filename: ./certs/envoy.key
  - "@type": type.googleapis.com/envoy.config.listener.v3.Listener
    name: listener_soap
    enable_reuse_port: false
    address:
      socket_address:
        address: ${LISTENER_SOAP_ADDRESS}
        port_value: ${LISTENER_SOAP_PORT}
    filter_chains:
      - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: listener_http
              access_log:
                - name: envoy.access_loggers.stdout
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                    log_format:
                      text_format_source:
                        inline_string: "[%START_TIME%] %REQ(:METHOD)% %REQ(:PATH)% host=%REQ(:AUTHORITY)% ua=%REQ(USER-AGENT)% xff=%REQ(X-FORWARDED-FOR)% corr=%REQ(X-CORRELATION-ID)% cluster=%UPSTREAM_CLUSTER% upstream=%UPSTREAM_HOST% -> %RESPONSE_CODE% time=%DURATION%ms req_id=%REQ(X-REQUEST-ID)%\n"
              http_filters:
                - name: envoy.filters.http.router
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              rds:
                route_config_name: route_config_soap
                config_source:
                  path_config_source:
                    path: ./rds/soap.yaml
        transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
            common_tls_context:
              tls_certificates:
                - certificate_chain:
                    filename: ./certs/envoy.crt
                  private_key:
                    filename: ./certs/envoy.key
