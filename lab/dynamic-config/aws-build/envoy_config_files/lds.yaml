version_info: "0"
resources:
  - "@type": type.googleapis.com/envoy.config.listener.v3.Listener
    name: rest_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 10000
    filter_chains:
      - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: listener_http
              access_log:
                - name: envoy.access_loggers.stdout
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                    log_format:
                      text_format_source:
                        inline_string: "[%START_TIME%] %REQ(:METHOD)% %REQ(:PATH)% -> %RESPONSE_CODE% upstream=%UPSTREAM_HOST% time=%DURATION%ms req_id=%REQ(X-REQUEST-ID)%\n"
              http_filters:
                - name: envoy.filters.http.router
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              rds:
                route_config_name: route_config_rest
                config_source:
                  path_config_source:
                    path: envoy_config_files/rds/rest.yaml
        transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
            common_tls_context:
              tls_certificates:
                - certificate_chain:
                    filename: envoy_config_files/certs/envoy-localhost.crt
                  private_key:
                    filename: envoy_config_files/certs/envoy-localhost.key
  - "@type": type.googleapis.com/envoy.config.listener.v3.Listener
    name: soap_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 20000
    filter_chains:
      - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: listener_http
              access_log:
                - name: envoy.access_loggers.stdout
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                    log_format:
                      text_format_source:
                        inline_string: "[%START_TIME%] %REQ(:METHOD)% %REQ(:PATH)% -> %RESPONSE_CODE% upstream=%UPSTREAM_HOST% time=%DURATION%ms req_id=%REQ(X-REQUEST-ID)%\n"
              http_filters:
                - name: envoy.filters.http.router
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              rds:
                route_config_name: route_config_soap
                config_source:
                  path_config_source:
                    path: envoy_config_files/rds/soap.yaml
        transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
            common_tls_context:
              tls_certificates:
                - certificate_chain:
                    filename: envoy_config_files/certs/envoy-localhost.crt
                  private_key:
                    filename: envoy_config_files/certs/envoy-localhost.key
